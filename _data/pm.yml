# Package-manager commands, shared by every page that sets `pm:` in its front matter.
# Change a command here and every OS using that package manager picks it up.
#
#   lang          code-block language (bash or powershell)
#   update_label  optional text above the update block (default "Update everything:")
#   update        list of commands; rendered one per line, chained with `&&\` (bash)
#                 or as separate lines (powershell: Windows PowerShell 5.1 has no `&&`)
#   install       install command; packages are appended on the same line
#   one_per_line  emit a separate install command per package (winget)
#   sshd_pkg      package that provides the SSH server
#   sshd_service  systemd unit name for the SSH server

apt:
  lang: bash
  update:
    - "sudo apt update"
    - "sudo apt full-upgrade -y"
  install: "sudo apt install -y"
  sshd_pkg: openssh-server
  sshd_service: ssh

dnf:
  lang: bash
  update:
    - "sudo dnf upgrade --refresh -y"
  install: "sudo dnf install -y"
  sshd_pkg: openssh-server
  sshd_service: sshd

pacman:
  lang: bash
  update:
    - "sudo pacman -Syu"
  install: "sudo pacman -S --needed"
  sshd_pkg: openssh
  sshd_service: sshd

winget:
  lang: powershell
  update_label: "Update apps installed through winget, including Store apps winget can see:"
  update:
    - "winget upgrade --all --accept-source-agreements --accept-package-agreements"
  install: "winget install -e --accept-source-agreements --accept-package-agreements --id"
  one_per_line: true
