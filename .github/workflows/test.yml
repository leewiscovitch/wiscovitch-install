# Runs every page's code blocks on fresh machines after each GitHub Pages build.
# Blocks are taken from the live site, so this tests exactly what gets copied.
name: Test pages

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    name: ${{ matrix.page }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { page: /ubuntu/desktop/, image: "ubuntu:26.04" }
          - { page: /ubuntu/server/, image: "ubuntu:26.04" }
          - { page: /fedora/, image: "fedora:latest" }
          - { page: /alma/, image: "almalinux:9" }
          - { page: /alma/, image: "almalinux:10" }
          - { page: /alma/, image: "rockylinux/rockylinux:9" }
          - { page: /alma/, image: "rockylinux/rockylinux:10" }
          - { page: /cachyos/, image: "archlinux:latest" }
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the published site and extract blocks
        run: python3 tests/extract.py --wait "$GITHUB_SHA" "${{ matrix.page }}" blocks

      - name: Run blocks in a fresh ${{ matrix.image }} container
        run: docker run --rm -v "$PWD/blocks:/blocks" -v "$PWD/tests:/tests:ro" "${{ matrix.image }}" bash /tests/run_linux.sh /blocks

      - name: Report
        if: always()
        run: python3 tests/summarize.py blocks "${{ matrix.page }} on ${{ matrix.image }}"

      - name: Keep blocks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocks-${{ strategy.job-index }}
          path: blocks/

  windows:
    name: /windows/ on Windows Server
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the published site and extract blocks
        run: python tests/extract.py --wait "$env:GITHUB_SHA" /windows/ blocks

      - name: Make sure winget is available
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
              Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
              Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version

      # Windows PowerShell, not the default pwsh: blocks install/upgrade PowerShell 7,
      # which would kill a step running in it (the page gives the same advice)
      - name: Run blocks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run_windows.ps1 -Dir blocks

      - name: Check SSH key auth and PowerShell 7 as the SSH shell
        run: |
          # Authorize a throwaway key the same way the page authorizes GitHub keys, then log in to localhost.
          # Log in as a regular local admin: sshd can't create a session for the runner's own runneradmin account.
          $pw = ConvertTo-SecureString ("Ci-" + [Guid]::NewGuid().ToString()) -AsPlainText -Force
          New-LocalUser -Name citest -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member citest
          ssh-keygen -q -t ed25519 -N '""' -f "$env:RUNNER_TEMP\ci_key"
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$env:RUNNER_TEMP\ci_key.pub" | Add-Content -Path $keys
          icacls.exe $keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          Restart-Service sshd
          Get-Service sshd | Format-List Name, Status, StartType
          Get-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -ErrorAction SilentlyContinue | Format-List DefaultShell
          icacls.exe $keys
          # Use Windows' own ssh client (the PATH may find Git's newer one first)
          "client: " + (& "$env:WINDIR\System32\OpenSSH\ssh.exe" -V 2>&1)
          $out = & "$env:WINDIR\System32\OpenSSH\ssh.exe" -v -i "$env:RUNNER_TEMP\ci_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o BatchMode=yes "citest@localhost" 'Write-Output ("PS=" + $PSVersionTable.PSVersion.ToString())' 2>&1
          "ssh exit $LASTEXITCODE, output:"; $out
          if ($LASTEXITCODE -and -not ($out | Select-String -Pattern 'Server accepts key')) {
              "--- sshd service binary:"; (Get-CimInstance Win32_Service -Filter "Name='sshd'").PathName
              "--- sshd effective config:"; & "$env:WINDIR\System32\OpenSSH\sshd.exe" -T 2>&1 | Select-String 'authorizedkeysfile|pubkeyauthentication|strictmodes'
              "--- sshd_config Match block:"; Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern 'Match|AuthorizedKeysFile|PubkeyAuthentication'
              "--- administrators_authorized_keys:"; Get-Content $keys | ForEach-Object { $_.Substring(0, [Math]::Min(60, $_.Length)) }
              "--- file owner:"; (Get-Acl $keys).Owner
              "--- OpenSSH events:"; Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 15 -ErrorAction SilentlyContinue | ForEach-Object { $_.Message }
          }
          # sshd accepting the key proves the page's key setup works. Starting the session can fail on
          # GitHub's runners (ssh_dispatch_run_fatal at pre-auth), which a real machine doesn't hit.
          $version = ($out | Select-String -Pattern 'PS=(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }) | Select-Object -First 1
          $accepted = [bool]($out | Select-String -Pattern 'Server accepts key')
          if ($version -match '^7\.') { $status = 'pass'; $note = "logged in; remote shell is PowerShell $version" }
          elseif ($accepted) { $status = 'pass'; $note = 'key accepted by sshd (session start not possible on CI runner)' }
          else { $status = 'fail'; $note = 'sshd did not accept the key' }
          "check-ssh-key`t$status`t$note" | Out-File -FilePath blocks\results.tsv -Append -Encoding utf8
          $shell = (Get-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -ErrorAction SilentlyContinue).DefaultShell
          $shellOk = $shell -like '*\PowerShell\7\pwsh.exe' -and (Test-Path $shell)
          "check-ssh-shell`t$(if ($shellOk) { 'pass' } else { 'fail' })`tDefaultShell = $shell" | Out-File -FilePath blocks\results.tsv -Append -Encoding utf8
          ($out | Out-String) | Out-File -FilePath blocks\check-ssh-login.log -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Report
        if: always()
        run: python tests/summarize.py blocks "/windows/ on Windows Server"

      - name: Keep blocks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocks-windows
          path: blocks/
