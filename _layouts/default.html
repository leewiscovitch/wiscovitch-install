<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="revision" content="{{ site.github.build_revision }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    /* Native controls (scrollbars) follow the light/dark scheme */
    :root { color-scheme: light dark; }
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
      --code-bg: #f6f8fa; --accent: #0969da; --ok: #1a7f37;
      --inline-bg: #eff2f5; --inline-fg: #1f2328; --inline-border: #d1d9e0;
      --hl-keyword: #cf222e; --hl-command: #8250df; --hl-flag: #0550ae;
      --hl-string: #0a3069; --hl-var: #953800; --hl-comment: #6e7781;
      /* Inline code kinds ({:.cmd} etc.): >= 4.5:1 on --inline-bg; cmd/user kept apart for red-green colour blindness */
      --code-cmd: #c2410c; --code-user: #0f766e; --code-path: #0550ae; --code-val: #7a3fc9;
      --code-sudo: #d00000;   /* sudo, bold, in prose and code blocks: stronger than the keyword red */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
        --code-bg: #161b22; --accent: #4493f8; --ok: #3fb950;
        --inline-bg: #1f2a3a; --inline-fg: #e6edf3; --inline-border: #2f4a6b;
        --hl-keyword: #ff7b72; --hl-command: #d2a8ff; --hl-flag: #79c0ff;
        --hl-string: #a5d6ff; --hl-var: #ffa657; --hl-comment: #8b949e;
        --code-cmd: #ffa657; --code-user: #3fd6a7; --code-path: #79c0ff; --code-val: #d2a8ff;
        --code-sudo: #ff5c5c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin-top: 0; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: 2em; scroll-margin-top: 60px; }
    .back { display: inline-block; margin-bottom: 8px; font-size: 14px; text-decoration: none; }
    .section-nav {
      position: sticky; top: 0; z-index: 10; margin: 0 -16px 16px; padding: 10px 16px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 6px 8px;
    }
    .section-nav a {
      font-size: 14px; text-decoration: none; padding: 3px 10px;
      border: 1px solid var(--border); border-radius: 999px;
    }
    .section-nav a:hover { border-color: var(--accent); }
    ul.os-list { padding-left: 1.2em; }
    ul.os-list li { margin: .3em 0; font-size: 18px; }
    a { color: var(--accent); }
    code { font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; font-variant-ligatures: none; }
    :not(pre) > code {
      background: var(--inline-bg); color: var(--inline-fg); border: 1px solid var(--inline-border);
      padding: .1em .4em; border-radius: 4px;
    }
    /* Inline code kinds, tagged in Markdown with `text`{:.cmd} and so on */
    :not(pre) > code.cmd { color: var(--code-cmd); }    /* commands and packages: nano, systemctl, micro */
    :not(pre) > code.user { color: var(--code-user); }  /* users and hosts: tech, root, wiscopronode1 */
    :not(pre) > code.path { color: var(--code-path); }  /* paths and files: /opt/claude, ~/.ssh/config */
    :not(pre) > code.val { color: var(--code-val); }    /* values and settings: ignore, 1800, Bypass */
    /* sudo stands out everywhere: inline ({:.sudo}) and in code blocks (marked by the script below) */
    :not(pre) > code.sudo, .highlight span.sudo { color: var(--code-sudo); font-weight: 700; }
    pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px 16px; padding-right: 72px; overflow-x: auto;
    }
    /* Holds the button outside the scrolling pre so it stays put */
    .code-wrap { position: relative; margin: 16px 0; }
    .code-wrap pre { margin: 0; }
    /* Syntax colors for the classes Rouge puts on code-block tokens */
    .highlight .c, .highlight .c1, .highlight .ch, .highlight .cm, .highlight .cs { color: var(--hl-comment); font-style: italic; }
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kr, .highlight .kc, .highlight .kp, .highlight .kt { color: var(--hl-keyword); }
    .highlight .nb, .highlight .nf, .highlight .bp, .highlight .n { color: var(--hl-command); }
    .highlight .nt, .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh { color: var(--hl-flag); }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sd, .highlight .se,
    .highlight .sh, .highlight .si, .highlight .sx, .highlight .no { color: var(--hl-string); }
    .highlight .nv, .highlight .vg, .highlight .vi, .highlight .vc { color: var(--hl-var); }
    .highlight .o, .highlight .ow { color: var(--hl-keyword); }
    /* Expected output (```output blocks): the machine's answer, not something to paste. Page
       background, dashed border, muted text, an "Output" label and no Copy button; it sits
       right under its command. Long output is collapsed by the script below. */
    div.language-output { position: relative; margin-top: -8px; }
    div.language-output pre {
      background: var(--bg); border-style: dashed; color: var(--muted); padding-right: 16px; padding-top: 22px;
    }
    div.language-output::before {
      content: "Output"; position: absolute; top: 5px; left: 16px; z-index: 1;
      font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    }
    .output-toggle {
      font: 13px system-ui, sans-serif; color: var(--accent); background: none; border: 0;
      padding: 4px 0 0; cursor: pointer;
    }
    /* Notes for commands that print nothing (or ask questions): _includes/no-output.md */
    p.no-output { margin: -6px 0 16px; font-size: 14px; color: var(--muted); }
    p.no-output::before { content: "Output: "; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      font: 13px system-ui, sans-serif; padding: 4px 10px; cursor: pointer;
      color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    }
    .copy-btn:hover { border-color: var(--accent); }
    .copy-btn.copied { color: var(--ok); border-color: var(--ok); }
  </style>
</head>
<body>
  <main>
    {% if page.url != "/" %}<a class="back" href="{{ page.parent | default: '/' | relative_url }}">← {{ page.parent_title | default: 'All OSes' }}</a>{% endif %}
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
  <script>
    // Sticky bar linking to each ## section, built from the page's h2 headings
    (function () {
      var heads = document.querySelectorAll('main h2[id]');
      if (heads.length < 2) return;
      var nav = document.createElement('nav');
      nav.className = 'section-nav';
      heads.forEach(function (h) {
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        nav.appendChild(a);
      });
      var h1 = document.querySelector('main h1');
      h1.parentNode.insertBefore(nav, h1.nextSibling);
    })();

    // Rouge's bash lexer leaves external commands (ssh-keygen, timedatectl, systemctl) as plain
    // text, so mark the command word of each command like the PowerShell lexer does: line
    // starts, after sudo, a pipe, &&, ||, ;, { or $(. Heredoc bodies are file contents, not
    // commands. Only adds colour; the text (and so what Copy copies) is unchanged.
    document.querySelectorAll('div.language-bash pre code').forEach(function (code) {
      var marks = [], pos = 0, heredoc = null, continued = false;
      var keywords = /^(if|then|else|elif|fi|for|while|until|do|done|case|esac|in|function|time|!)$/;
      code.textContent.split('\n').forEach(function (line) {
        var start = pos;
        pos += line.length + 1;
        if (heredoc) { if (line.trim() === heredoc) heredoc = null; continued = false; return; }
        var hd = line.match(/<<-?\s*['"]?([A-Za-z_]\w*)['"]?/);
        var wasContinued = continued;
        continued = /\\$/.test(line) && !/(&&|\|\||\|)\s*\\$/.test(line);   // "\" without &&/|| continues the arguments
        var re = /(^\s*|\|\|?\s*|&&\s*|;\s*|\{\s+|\$\()([A-Za-z0-9_.\/~+][\w.\/~+-]*)/g, m;
        while ((m = re.exec(line))) {
          var word = m[2], at = start + m.index + m[1].length;
          if (m.index === 0 && m[1].trim() === '' && wasContinued) continue;
          if (/^\s*#/.test(line) || keywords.test(word)) continue;
          if (/^\w+=/.test(line.slice(at - start))) continue;                 // assignment, e.g. n=$(hostname -s)
          marks.push([at, word]);
          var next = word === 'sudo' && line.slice(at - start + 4).match(/^(\s+)([A-Za-z0-9_.\/~+][\w.\/~+-]*)/);
          if (next) marks.push([at + 4 + next[1].length, next[2]]);         // sudo runs the next word
        }
        if (hd) heredoc = hd[1];
      });
      // Wrap each word where it sits inside one uncoloured text node, last first so offsets stay valid
      var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT), nodes = [], node, off = 0;
      while ((node = walker.nextNode())) { nodes.push([node, off]); off += node.nodeValue.length; }
      marks.sort(function (a, b) { return b[0] - a[0]; }).forEach(function (k) {
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i][0], o = nodes[i][1];
          if (k[0] < o || k[0] + k[1].length > o + n.nodeValue.length) continue;
          var parent = n.parentNode;
          if (parent !== code && parent.className && !/^(w|err)$/.test(parent.className)) return;   // Rouge coloured it already
          var r = document.createRange();
          r.setStart(n, k[0] - o);
          r.setEnd(n, k[0] - o + k[1].length);
          var span = document.createElement('span');
          span.className = 'nb';
          r.surroundContents(span);
          return;
        }
      });
    });

    // Make sudo stand out in every code block (Rouge or the script above already wraps it)
    document.querySelectorAll('pre code span').forEach(function (s) {
      if (s.textContent.trim() === 'sudo') s.classList.add('sudo');
    });

    // Long expected output: show the first and last lines, with a toggle for the rest
    document.querySelectorAll('div.language-output pre code').forEach(function (code) {
      var full = code.textContent.replace(/\n+$/, ''), lines = full.split('\n'), keep = 4;
      if (lines.length <= keep * 2 + 4) return;
      var hidden = lines.length - keep * 2;
      var short = lines.slice(0, keep).concat(['… ' + hidden + ' more lines …'], lines.slice(-keep)).join('\n');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'output-toggle';
      var show = function (all) {
        code.textContent = all ? full : short;
        btn.textContent = all ? 'Show less' : 'Show all ' + lines.length + ' lines';
        btn.setAttribute('aria-expanded', all);
      };
      btn.addEventListener('click', function () { show(btn.getAttribute('aria-expanded') !== 'true'); });
      show(false);
      code.closest('div.language-output').appendChild(btn);
    });

    // Add a Copy button to every code block (not to expected output)
    document.querySelectorAll('pre').forEach(function (pre) {
      if (pre.closest('div.language-output')) return;
      // Read the text before the button is added so its label isn't copied
      var text = pre.innerText.replace(/\n+$/, '');
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.textContent = 'Copy';
      var flash = function (label, ok) {
        btn.textContent = label;
        btn.classList.toggle('copied', ok);
        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2500);
      };
      // Fallback for plain-http, older browsers, or when the Clipboard API is refused
      var legacyCopy = function () {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
        return ok;
      };
      // Last resort: highlight the code so Ctrl+C works
      var selectCode = function () {
        var range = document.createRange();
        range.selectNodeContents(pre.querySelector('code') || pre.firstChild);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        flash('Press Ctrl+C', false);
      };
      btn.addEventListener('click', function () {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () { flash('Copied', true); }, function () {
            legacyCopy() ? flash('Copied', true) : selectCode();
          });
        } else {
          legacyCopy() ? flash('Copied', true) : selectCode();
        }
      });
      var wrap = document.createElement('div');
      wrap.className = 'code-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      wrap.appendChild(btn);
    });
  </script>
</body>
</html>
