title: Install Steps
description: Copy/paste steps for setting up a fresh OS

# Account name used in steps (sudoers, etc.)
user: tech

# Time zone for every OS (Linux IANA name, Windows ID)
timezone: America/New_York
timezone_windows: Eastern Standard Time

# GitHub account whose public SSH keys (github.com/<user>.keys) are trusted for logins
github_user: leewiscovitch

# Pinned versions. Every download URL and every "should show" note on the pages is
# built from these, so a version is changed in one place. To update one, change its
# version (and release tag, if it has one) plus the SHA-256 of the new download; GitHub
# shows it as "sha256:..." next to each release asset.

# Windows MSIs from GitHub releases
openssh_msi:     # PowerShell/Win32-OpenSSH; URL: releases/download/<release>/OpenSSH-Win64-v<version>.msi
  version: 10.4.0.0
  release: 10.4.0.0p1-Preview
  sha256: 788D8643464A01EB63640A2FD746F9ED23D106B5A901A35F88DC8CD40E446AC9
pwsh_msi:        # PowerShell/PowerShell; URL: releases/download/v<version>/PowerShell-<version>-win-x64.msi
  version: 7.6.8
  sha256: 079E7CECEDD1E87FA7B4676E5C33DDFBE66859A44A97FBCD1DB797245CBB93D2

# winget version last seen by the tests. Not a pin (Repair-WinGetPackageManager -Latest
# always gets the newest); only used for the "should show ... or newer" note.
winget_version: 1.29.380

# Pinned PowerShell Gallery modules, downloaded as .nupkg (a zip) from
# https://www.powershellgallery.com/api/v2/package/<name>/<version> and unzipped into
# Program Files, so steps don't depend on Install-Module, NuGet or the Gallery's search.
# To update: new version plus the SHA-256 of that download. Also read by test.yml.
ps_modules:
  PSWindowsUpdate:
    version: 2.2.1.5
    sha256: 174E05B1C194377F8D9AE0B004C93304C662EA9B5FC4DAFA19426049D2D5CF50
  Microsoft.WinGet.Client:
    version: 1.29.380
    sha256: 3469E5747EB6B100E51FED3F2057386B5BA60BC8955A6669B5C2EB562E316619
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from

# Every page uses the default layout without having to say so
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep the Cloudflare DNS export and repo housekeeping off the site
exclude:
  - wiscovitch.org.txt
  - README.md
  - CLAUDE.md
  - CLAUDE.local.md
  - tests/
  - proxmox/
