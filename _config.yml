title: Install Steps
description: Copy/paste steps for setting up a fresh OS

# Account name used in steps (sudoers, etc.)
user: tech

# Time zone for every OS (Linux IANA name, Windows ID)
timezone: America/New_York
timezone_windows: Eastern Standard Time

# GitHub account whose public SSH keys (github.com/<user>.keys) are trusted for logins
github_user: leewiscovitch

# Pinned Windows MSIs (GitHub releases). To update: new URL plus the SHA-256 shown
# for the file on its release page ("sha256:..." next to the asset).
openssh_msi:
  version: 10.4.0.0
  url: https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-Win64-v10.4.0.0.msi
  sha256: 788D8643464A01EB63640A2FD746F9ED23D106B5A901A35F88DC8CD40E446AC9
pwsh_msi:
  version: 7.6.7
  url: https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/PowerShell-7.6.7-win-x64.msi
  sha256: EC575CEF9EC56FCD905DE0D5EEAC9CB7F81A0A65ABB87BB5CD0E87FDFE2B8CC0
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from

# Every page uses the default layout without having to say so
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep the Cloudflare DNS export and repo housekeeping off the site
exclude:
  - wiscovitch.org.txt
  - README.md
  - CLAUDE.md
  - CLAUDE.local.md
  - tests/
  - proxmox/
